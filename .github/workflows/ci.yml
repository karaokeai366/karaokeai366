name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  signaling:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/signaling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: node dist/serverPartyReadyV2.js > /tmp/karaokeai-signaling.log 2>&1 &
      - run: sleep 1
      - run: npm run smoke

  media-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/media-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m compileall -q src
