services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
      - "5443:5443"
    environment:
      KARAOKE_LAN_IP: ${KARAOKE_LAN_IP:-127.0.0.1}
    volumes:
      - ./.dev-certs:/etc/nginx/certs
    depends_on:
      - signaling
      - media-worker
    restart: unless-stopped

  signaling:
    build:
      context: ./apps/signaling
    environment:
      PORT: 8787
      KARAOKE_SESSION_STORE: /app/data/sessions.json
    ports:
      - "8787:8787"
    volumes:
      - karaokeai-session:/app/data
    restart: unless-stopped

  media-worker:
    build:
      context: ./apps/media-worker
    environment:
      KARAOKE_MEDIA_ROOT: /app/data/media
      AUDIO_SEPARATOR_MODEL_DIR: /app/data/models
      KARAOKE_ENABLE_SOURCE_SEPARATION: "true"
      KARAOKE_SEPARATOR_MODE: quality
    ports:
      - "8790:8790"
    volumes:
      - karaokeai-media-quality:/app/data/media
      - karaokeai-models:/app/data/models
    restart: unless-stopped

volumes:
  karaokeai-media-quality:
  karaokeai-models:
  karaokeai-session:
