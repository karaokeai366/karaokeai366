services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - signaling
      - media-worker
    restart: unless-stopped

  signaling:
    build:
      context: ./apps/signaling
    environment:
      PORT: 8787
    ports:
      - "8787:8787"
    restart: unless-stopped

  media-worker:
    build:
      context: ./apps/media-worker
    environment:
      KARAOKE_MEDIA_ROOT: /app/data/media
      AUDIO_SEPARATOR_MODEL_DIR: /app/data/models
      KARAOKE_ENABLE_SOURCE_SEPARATION: "true"
    ports:
      - "8790:8790"
    volumes:
      - karaokeai-media:/app/data/media
      - karaokeai-models:/app/data/models
    restart: unless-stopped

volumes:
  karaokeai-media:
  karaokeai-models:
