<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="KaraokeAI — karaokê distribuído, local-first e multiplataforma." />
    <title>KaraokeAI</title>
  </head>
  <body>
    <script src="/runtime-config.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        const TOAST_ID = 'karaokeai-queue-toast';

        function toast(message, kind = 'info') {
          let el = document.getElementById(TOAST_ID);
          if (!el) {
            el = document.createElement('div');
            el.id = TOAST_ID;
            el.style.cssText = [
              'position:fixed', 'left:50%', 'bottom:24px', 'transform:translateX(-50%)',
              'z-index:10020', 'max-width:min(92vw,520px)', 'padding:12px 16px',
              'border-radius:14px', 'background:rgba(18,19,26,.96)',
              'border:1px solid rgba(255,255,255,.14)', 'box-shadow:0 12px 40px rgba(0,0,0,.3)',
              'color:#fff', 'font:600 14px system-ui,sans-serif', 'text-align:center',
              'opacity:0', 'transition:opacity .18s ease'
            ].join(';');
            document.body.appendChild(el);
          }
          el.textContent = message;
          el.style.borderColor = kind === 'error' ? 'rgba(255,90,90,.45)' : 'rgba(255,255,255,.14)';
          requestAnimationFrame(() => { el.style.opacity = '1'; });
          window.clearTimeout(Number(el.dataset.timer || 0));
          const timer = window.setTimeout(() => { el.style.opacity = '0'; }, 2800);
          el.dataset.timer = String(timer);
        }

        function isHostScreen() {
          return Boolean(document.querySelector('.welcome'))
            && /SALA CRIADA/i.test(document.body.innerText || '');
        }

        const preparing = new Set();

        function processQueue() {
          if (!isHostScreen()) return;

          document.querySelectorAll('button.queue-prepare').forEach((button) => {
            if (!(button instanceof HTMLButtonElement)) return;
            const row = button.closest('.queue-row');
            const title = row?.querySelector('.queue-info strong')?.textContent?.trim() || 'música';
            const key = `${title}|${row?.textContent || ''}`;
            if (preparing.has(key)) return;
            preparing.add(key);

            toast(`🎵 ${title} entrou na fila. Preparando automaticamente…`);
            button.click();
          });
        }

        document.addEventListener('click', (event) => {
          const target = event.target;
          if (!(target instanceof Element)) return;
          const button = target.closest('button.add-result');
          if (button) toast('⏳ Música enviada para a fila. Aguarde a preparação…');
        }, true);

        const observer = new MutationObserver(() => {
          processQueue();
        });

        window.addEventListener('load', () => {
          observer.observe(document.body, { childList: true, subtree: true });
          window.setTimeout(processQueue, 250);
        });
      })();
    </script>
  </body>
</html>
